<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - Developer Gyan</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyDc8SBATauI9wMiwvIsrYsIuyXD_QOCKB8",
            authDomain: "developer-ab7cb.firebaseapp.com",
            databaseURL: "https://developer-ab7cb-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "developer-ab7cb",
            storageBucket: "developer-ab7cb.firebasestorage.app",
            messagingSenderId: "178491860220",
            appId: "1:178491860220:web:d874ac1cb68954c2d02379"
        };
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        const auth = firebase.auth();
    </script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { background-color: #05050a; color: #fff; padding: 20px; }
        .container { max-width: 1000px; margin: 0 auto; }
        h2 { color: #f87171; text-align: center; margin-bottom: 20px; text-transform: uppercase; letter-spacing: 1px;}
        .box { background: rgba(20, 20, 30, 0.9); border: 1px solid rgba(168, 85, 247, 0.3); padding: 25px; border-radius: 12px; margin-bottom: 25px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        input, select, textarea { width: 100%; padding: 12px; margin: 8px 0 15px 0; background: #0a0a14; border: 1px solid rgba(168, 85, 247, 0.4); border-radius: 8px; color: #fff; outline: none; font-size: 0.95rem;}
        .btn { background: linear-gradient(135deg, #9333ea, #38bdf8); color: white; border: none; padding: 12px 20px; border-radius: 8px; cursor: pointer; font-weight: bold; width: 100%; font-size: 1.05rem; transition: 0.2s;}
        table { width: 100%; border-collapse: collapse; margin-top: 15px; font-size: 0.9rem; background: #0a0a14; border-radius: 8px; overflow: hidden;}
        th, td { border: 1px solid rgba(168, 85, 247, 0.2); padding: 12px; text-align: left; }
        th { background: rgba(168, 85, 247, 0.15); color: #e879f9; font-weight: bold;}
        .del-btn { background: #dc2626; color: #fff; border: none; padding: 6px 12px; border-radius: 6px; cursor: pointer; font-weight: bold;}
        .form-row { display: flex; gap: 15px; flex-wrap: wrap;}
        .form-group { flex: 1; min-width: 250px; }
    </style>
</head>
<body>

    <div class="container">
        <h2>🔒 Central Secured Admin Dashboard</h2>
        <div style="text-align: center; margin-bottom: 30px;"><a href="index.html" style="color: #38bdf8; text-decoration: none; font-weight: bold; padding: 5px 15px; border: 1px solid #38bdf8; border-radius: 20px;">← Go to Main Store</a></div>

        <div id="login-box" class="box" style="max-width: 500px; margin: 0 auto;">
            <h3 style="color: #38bdf8; margin-bottom: 15px;">Admin Authentication</h3>
            <label>Admin Email</label><input type="email" id="admin-email" value="admin@developergyan.com">
            <label>Password</label><input type="password" id="admin-pass">
            <button class="btn" onclick="login()" style="margin-top: 10px;">Login to Dashboard</button>
        </div>

        <div id="dashboard" style="display: none;">
            
            <!-- NEW REGISTERED CUSTOMERS BOX -->
            <div class="box" style="border-color: #f43f5e; border-top: 4px solid #f43f5e;">
                <h3 style="color: #f43f5e; margin-bottom: 15px;">👥 Registered Customers</h3>
                <p style="color: #94a3b8; font-size: 0.9rem; margin-bottom: 15px;">Total Users: <strong id="total-users-count" style="color: #fff; font-size: 1.2rem;">0</strong></p>
                <div style="overflow-x: auto;">
                    <table>
                        <thead><tr><th>Name</th><th>Email ID</th><th>Last Login</th></tr></thead>
                        <tbody id="users-table-body"></tbody>
                    </table>
                </div>
            </div>

            <!-- INVENTORY MANAGER -->
            <div class="box">
                <h3 style="color: #34d399; margin-bottom: 15px;">📦 Store Inventory & Stock Count</h3>
                <div style="overflow-x: auto;"><table><thead><tr><th>Category</th><th>Name</th><th>Stock Codes</th><th>Status</th><th>Actions</th></tr></thead><tbody id="inventory-table-body"></tbody></table></div>
            </div>

            <!-- STORE MANAGER -->
            <div class="box" style="border-top: 4px solid #38bdf8;">
                <h3 style="color: #38bdf8; margin-bottom: 15px;">🏪 Add Item / Voucher</h3>
                <div class="form-row">
                    <div class="form-group"><label>Category</label><select id="add-main-cat" onchange="updateSubCatDropdown()"></select></div>
                    <div class="form-group" id="sub-cat-container"><label>Folder</label><select id="add-sub-cat"><option value="">-- Direct --</option></select></div>
                </div>
                <div class="form-row">
                    <div class="form-group"><label>Name / Title</label><input type="text" id="add-name"></div>
                    <div class="form-group"><label>Price</label><input type="text" id="add-price"></div>
                </div>
                <button class="btn" onclick="addEntity()">➕ Add Item</button>
            </div>

            <button class="del-btn" style="width: 100%; padding: 12px; font-size: 1.1rem;" onclick="logout()">Logout Dashboard</button>
        </div>
    </div>

    <script>
        let appData = {};

        function login() {
            const email = document.getElementById('admin-email').value;
            const pass = document.getElementById('admin-pass').value;
            auth.signInWithEmailAndPassword(email, pass).then(() => {
                document.getElementById('login-box').style.display = 'none';
                document.getElementById('dashboard').style.display = 'block';
                listenLiveData(); 
            }).catch(() => alert("Login Failed."));
        }

        function logout() { auth.signOut().then(() => location.reload()); }

        function listenLiveData() {
            db.ref('storeData').on('value', (snapshot) => {
                appData = snapshot.val() || {};
                updateDropdowns();
                renderInventory();
            });

            // --- FETCH USERS FROM DATABASE ---
            db.ref('registeredUsers').on('value', (snapshot) => {
                const usersTable = document.getElementById('users-table-body');
                usersTable.innerHTML = '';
                if(snapshot.exists()) {
                    const usersData = snapshot.val();
                    const userKeys = Object.keys(usersData);
                    document.getElementById('total-users-count').innerText = userKeys.length; // Count display
                    
                    userKeys.forEach(uid => {
                        const u = usersData[uid];
                        usersTable.innerHTML += `<tr>
                            <td><strong>${u.name}</strong></td>
                            <td style="color:#38bdf8;">${u.email}</td>
                            <td style="font-size:0.85rem; color:#94a3b8;">${u.lastLogin || '-'}</td>
                        </tr>`;
                    });
                } else {
                    document.getElementById('total-users-count').innerText = "0";
                    usersTable.innerHTML = `<tr><td colspan="3" style="text-align:center;">No users registered yet.</td></tr>`;
                }
            });
        }

        function saveToDB() { db.ref('storeData').set(appData); }

        function updateDropdowns() {
            const mainSelect = document.getElementById('add-main-cat');
            mainSelect.innerHTML = '';
            for(let key in appData) {
                if(!appData[key].parentKey) mainSelect.innerHTML += `<option value="${key}">${appData[key].title}</option>`;
            }
            updateSubCatDropdown();
        }

        function updateSubCatDropdown() {
            const mainCat = document.getElementById('add-main-cat').value;
            const subSelect = document.getElementById('add-sub-cat');
            subSelect.innerHTML = '<option value="">-- Direct --</option>';
            if(mainCat && appData[mainCat] && appData[mainCat].subFolders) {
                appData[mainCat].subFolders.forEach(folder => {
                    subSelect.innerHTML += `<option value="${folder.key}">📁 ${folder.name}</option>`;
                });
            }
        }

        function addEntity() {
            const mainCat = document.getElementById('add-main-cat').value;
            const subCat = document.getElementById('add-sub-cat').value;
            const name = document.getElementById('add-name').value.trim();
            const price = document.getElementById('add-price').value.trim();
            if(!name || !price) return alert("Name and price required!");

            const targetCat = subCat ? subCat : mainCat;
            if(!appData[targetCat].items) appData[targetCat].items = [];
            
            appData[targetCat].items.push({ id: Date.now(), name, desc: "", price, status: "Active", codes: [] });
            alert(`Item Added!`);
            document.getElementById('add-name').value = ''; document.getElementById('add-price').value = '';
            saveToDB();
        }

        function renderInventory() {
            const tbody = document.getElementById('inventory-table-body');
            tbody.innerHTML = '';
            for(let key in appData) {
                const cat = appData[key];
                if(!cat) continue;
                if(cat.items) {
                    cat.items.forEach((item, index) => {
                        let stockCount = item.codes ? item.codes.length : 0;
                        tbody.innerHTML += `<tr>
                            <td>${cat.title || key}</td>
                            <td><strong>${item.name}</strong></td>
                            <td style="color:#34d399;">${stockCount}</td>
                            <td>${item.status}</td>
                            <td style="white-space:nowrap;"><button class="del-btn" onclick="deleteItem('${key}', ${index})">🗑️</button></td></tr>`;
                    });
                }
            }
        }

        function deleteItem(parentCat, itemIndex) {
            if(!confirm("Delete this item?")) return;
            appData[parentCat].items.splice(itemIndex, 1);
            saveToDB();
        }
    </script>
</body>
</html>
