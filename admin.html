<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - Developer Gyan</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { background-color: #05050a; color: #fff; padding: 20px; }
        .container { max-width: 900px; margin: 0 auto; }
        h2 { color: #f87171; text-align: center; margin-bottom: 20px; }
        
        .box { background: rgba(20, 20, 30, 0.9); border: 1px solid rgba(168, 85, 247, 0.3); padding: 25px; border-radius: 12px; margin-bottom: 20px; }
        input, select { width: 100%; padding: 10px; margin: 10px 0; background: #05050a; border: 1px solid rgba(168, 85, 247, 0.4); border-radius: 6px; color: #fff; }
        .btn { background: linear-gradient(135deg, #9333ea, #38bdf8); color: white; border: none; padding: 10px 20px; border-radius: 6px; cursor: pointer; font-weight: bold; width: 100%; }
        
        table { width: 100%; border-collapse: collapse; margin-top: 15px; font-size: 0.9rem; }
        th, td { border: 1px solid rgba(168, 85, 247, 0.2); padding: 10px; text-align: left; }
        th { background: rgba(168, 85, 247, 0.1); color: #c084fc; }
        .del-btn { background: #dc2626; color: #fff; border: none; padding: 5px 10px; border-radius: 4px; cursor: pointer; }
    </style>
</head>
<body>

    <div class="container">
        <h2>🔒 Central Admin Dashboard</h2>
        <div style="text-align: center; margin-bottom: 20px;">
            <a href="index.html" style="color: #38bdf8; text-decoration: none;">← Go to Main Website</a>
        </div>

        <div id="login-box" class="box">
            <h3>Login Required</h3>
            <input type="password" id="admin-pass" placeholder="Enter Password...">
            <button class="btn" onclick="login()">Access Dashboard</button>
        </div>

        <div id="dashboard" style="display: none;">
            
            <div class="box" style="border-color: #e879f9;">
                <h3 style="color: #e879f9;">📢 Post New Advertisement</h3>
                <label>Display Location</label>
                <select id="ad-placement">
                    <option value="both">Both (Home & Offers Page)</option>
                    <option value="home">Only Home Page (Under Go to Store)</option>
                    <option value="offers">Only Offers Page</option>
                </select>
                <input type="text" id="ad-title" placeholder="Ad Title (e.g. Mega Sale)">
                <input type="text" id="ad-image" placeholder="Image URL (Discord link recommended)">
                <input type="number" id="ad-minutes" placeholder="Auto-Close Timer (Minutes)">
                <input type="text" id="ad-link" placeholder="Redirect URL (Discord User ID Link)">
                <button class="btn" onclick="addNewAd()">Post Ad</button>
                
                <h4 style="margin-top: 20px; color: #e879f9;">Active Ads</h4>
                <table>
                    <thead><tr><th>Title</th><th>Location</th><th>Action</th></tr></thead>
                    <tbody id="ads-table-body"></tbody>
                </table>
            </div>

            <div class="box">
                <h3 style="color: #38bdf8;">🏪 Add New Store Item</h3>
                <select id="item-cat">
                    <option value="steam">Steam Account</option>
                    <option value="gaming_acc">Gaming Account</option>
                    <option value="prebuild_server">Prebuild DC Server</option>
                    <option value="custom_server">Custom Server Builder</option>
                    <option value="custom_bot">Custom Bot Builder</option>
                    <option value="vouchers">Vouchers</option>
                    <option value="bgmi_uc">BGMI UC Vouchers</option>
                </select>
                <input type="text" id="item-name" placeholder="Item Name">
                <input type="text" id="item-desc" placeholder="Description">
                <input type="text" id="item-price" placeholder="Price">
                <select id="item-status">
                    <option value="Active">Active</option>
                    <option value="New Stock Available">New Stock Available</option>
                    <option value="Out of Stock">Out of Stock</option>
                    <option value="Coming Soon">Coming Soon</option>
                </select>
                <button class="btn" onclick="addNewItem()">Add Store Item</button>

                <h4 style="margin-top: 20px; color: #38bdf8;">Store Inventory</h4>
                <table>
                    <thead><tr><th>Category</th><th>Item</th><th>Status</th><th>Action</th></tr></thead>
                    <tbody id="items-table-body"></tbody>
                </table>
            </div>

            <button class="del-btn" style="width: 100%; padding: 12px;" onclick="location.reload()">Logout</button>
        </div>
    </div>

    <script>
        const STORE_KEY = 'devGyanDataV6';
        const ADS_KEY = 'devGyanAdsData_v2';

        function login() {
            if(document.getElementById('admin-pass').value === '123gyan@') {
                document.getElementById('login-box').style.display = 'none';
                document.getElementById('dashboard').style.display = 'block';
                renderStoreTable();
                renderAdsTable();
            } else { alert("Wrong Password!"); }
        }

        // --- ADS LOGIC ---
        function getAds() {
            let ads = JSON.parse(localStorage.getItem(ADS_KEY)) || [];
            return ads.filter(ad => Date.now() < ad.expiryTime);
        }

        function renderAdsTable() {
            const tbody = document.getElementById('ads-table-body');
            tbody.innerHTML = '';
            getAds().forEach(ad => {
                const loc = ad.placement === 'both' ? 'Both' : ad.placement === 'home' ? 'Home' : 'Offers';
                tbody.innerHTML += `<tr><td>${ad.title}</td><td>${loc}</td><td><button class="del-btn" onclick="deleteAd(${ad.id})">Delete</button></td></tr>`;
            });
        }

        function addNewAd() {
            const title = document.getElementById('ad-title').value.trim();
            const imgUrl = document.getElementById('ad-image').value.trim();
            const minutes = parseInt(document.getElementById('ad-minutes').value);
            const link = document.getElementById('ad-link').value.trim();
            const placement = document.getElementById('ad-placement').value;

            if(!title || !minutes || !link) return alert("Fill Title, Minutes, Link!");

            let ads = getAds();
            ads.push({ id: Date.now(), title, imgUrl, link, placement, expiryTime: Date.now() + (minutes * 60000) });
            localStorage.setItem(ADS_KEY, JSON.stringify(ads));
            
            alert("Ad Posted!");
            renderAdsTable();
        }

        function deleteAd(id) {
            if(confirm("Delete Ad?")) {
                let ads = getAds().filter(ad => ad.id !== id);
                localStorage.setItem(ADS_KEY, JSON.stringify(ads));
                renderAdsTable();
            }
        }

        // --- STORE LOGIC ---
        function getStore() { return JSON.parse(localStorage.getItem(STORE_KEY)) || {}; }
        function saveStore(data) { localStorage.setItem(STORE_KEY, JSON.stringify(data)); }

        function renderStoreTable() {
            const data = getStore();
            const tbody = document.getElementById('items-table-body');
            tbody.innerHTML = '';
            for(let cat in data) {
                if(data[cat].items) {
                    data[cat].items.forEach((item, index) => {
                        tbody.innerHTML += `
                            <tr>
                                <td>${data[cat].title}</td>
                                <td>${item.name}</td>
                                <td>
                                    <select onchange="updateStatus('${cat}', ${index}, this.value)">
                                        <option ${item.status==='Active'?'selected':''}>Active</option>
                                        <option ${item.status==='Out of Stock'?'selected':''}>Out of Stock</option>
                                        <option ${item.status==='Coming Soon'?'selected':''}>Coming Soon</option>
                                    </select>
                                </td>
                                <td><button class="del-btn" onclick="deleteItem('${cat}', ${index})">Delete</button></td>
                            </tr>
                        `;
                    });
                }
            }
        }

        function addNewItem() {
            const cat = document.getElementById('item-cat').value;
            const name = document.getElementById('item-name').value;
            const desc = document.getElementById('item-desc').value;
            const price = document.getElementById('item-price').value;
            const status = document.getElementById('item-status').value;

            if(!name || !price) return alert("Fill Name & Price!");
            
            let data = getStore();
            if(!data[cat].items) data[cat].items = [];
            data[cat].items.push({ id: Date.now(), name, desc, price, status });
            saveStore(data);
            
            alert("Item Added!");
            renderStoreTable();
        }

        function updateStatus(cat, idx, status) {
            let data = getStore();
            data[cat].items[idx].status = status;
            saveStore(data);
        }

        function deleteItem(cat, idx) {
            if(confirm("Delete Item?")) {
                let data = getStore();
                data[cat].items.splice(idx, 1);
                saveStore(data);
                renderStoreTable();
            }
        }
    </script>
</body>
</html>
