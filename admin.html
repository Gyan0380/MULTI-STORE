<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyDc8SBATauI9wMiwvIsrYsIuyXD_QOCKB8",
            authDomain: "developer-ab7cb.firebaseapp.com",
            databaseURL: "https://developer-ab7cb-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "developer-ab7cb",
            storageBucket: "developer-ab7cb.firebasestorage.app",
            messagingSenderId: "178491860220",
            appId: "1:178491860220:web:d874ac1cb68954c2d02379"
        };
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        const auth = firebase.auth();
    </script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { background-color: #0b0f19; color: #fff; padding: 20px; }
        .container { max-width: 900px; margin: 0 auto; }
        h2 { color: #f87171; text-align: center; margin-bottom: 20px; }
        .box { background: #111827; border: 1px solid #374151; padding: 20px; border-radius: 10px; margin-bottom: 20px; }
        input, select, textarea { width: 100%; padding: 10px; margin: 8px 0; background: #1f2937; border: 1px solid #4b5563; border-radius: 5px; color: #fff; outline: none; }
        label { color: #9ca3af; font-size: 0.9rem; }
        .btn { background: #6366f1; color: white; border: none; padding: 10px 15px; border-radius: 5px; cursor: pointer; font-weight: bold; width: 100%; }
        .btn:hover { background: #4f46e5; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 0.9rem; }
        th, td { border: 1px solid #374151; padding: 10px; text-align: left; }
        th { background: #1f2937; }
        .del-btn { background: #ef4444; color: #fff; border: none; padding: 5px 10px; border-radius: 4px; cursor: pointer; }
        .app-btn { background: #10b981; color: #fff; border: none; padding: 5px 10px; border-radius: 4px; cursor: pointer; margin-right: 5px; }
        .edit-btn { background: #f59e0b; color: #fff; border: none; padding: 5px 10px; border-radius: 4px; cursor: pointer; margin-right: 5px; }
        .form-row { display: flex; gap: 10px; }
        .form-group { flex: 1; }
    </style>
</head>
<body>

    <div class="container">
        <h2>Admin Panel</h2>
        <div style="text-align: center; margin-bottom: 20px;"><a href="index.html" style="color: #6366f1; text-decoration: none;">← Go to Website</a></div>

        <div id="login-box" class="box" style="max-width: 400px; margin: 0 auto;">
            <h3>Admin Login</h3>
            <label>Email</label><input type="email" id="admin-email" value="admin@developergyan.com">
            <label>Password</label><input type="password" id="admin-pass">
            <button class="btn" onclick="login()" style="margin-top: 10px;">Login</button>
        </div>

        <div id="dashboard" style="display: none;">
            
            <div class="box">
                <h3 style="color: #eab308; margin-bottom: 10px;">⏳ Pending Payments</h3>
                <table>
                    <thead><tr><th>User</th><th>Item</th><th>UTR</th><th>Action</th></tr></thead>
                    <tbody id="orders-table-body"></tbody>
                </table>
            </div>

            <div class="box">
                <h3 style="color: #34d399; margin-bottom: 10px;">👥 Registered Users</h3>
                <p style="margin-bottom: 10px; font-size: 0.9rem;">Total Users: <strong id="total-users-count">0</strong></p>
                <table><thead><tr><th>Name</th><th>Email</th><th>Last Login</th></tr></thead><tbody id="users-table-body"></tbody></table>
            </div>

            <div class="box">
                <h3 style="color: #60a5fa; margin-bottom: 10px;">📁 1. Create Main Category</h3>
                <label>Category Name</label><input type="text" id="new-main-name">
                <label>Description</label><input type="text" id="new-main-desc">
                <button class="btn" onclick="addMainCategory()">Create Category</button>
            </div>

            <div class="box">
                <h3 style="color: #a78bfa; margin-bottom: 10px;">🏪 2. Add Item or Sub-Folder</h3>
                <div class="form-row">
                    <div class="form-group"><label>Select Category</label><select id="add-main-cat" onchange="updateSubCatDropdown()"></select></div>
                    <div class="form-group"><label>Select Sub-Folder (Optional)</label><select id="add-sub-cat"><option value="">-- Direct Item --</option></select></div>
                </div>
                <div class="form-row">
                    <div class="form-group"><label>Type</label><select id="add-type" onchange="togglePriceField()"><option value="item">Item</option><option value="folder">Sub-Folder</option></select></div>
                    <div class="form-group"><label>Name</label><input type="text" id="add-name"></div>
                </div>
                <label>Description</label><input type="text" id="add-desc">
                <div id="price-box">
                    <label>Price</label><input type="text" id="add-price">
                    <label>Status</label><select id="add-status"><option value="Active">Active</option><option value="Out of Stock">Out of Stock</option></select>
                    <label>Voucher Codes (Stock - One per line)</label><textarea id="add-codes" rows="3"></textarea>
                </div>
                <button class="btn" onclick="addEntity()" style="margin-top: 10px;">Add Item / Folder</button>
            </div>

            <div class="box" id="edit-box" style="display: none; border-color: #f59e0b;">
                <h3 style="color: #f59e0b; margin-bottom: 10px;">✏️ Edit Item / Category</h3>
                <label>Name</label><input type="text" id="edit-name">
                <label>Description</label><input type="text" id="edit-desc">
                <div id="edit-price-box">
                    <label>Price</label><input type="text" id="edit-price">
                    <label>Status</label><select id="edit-status"><option value="Active">Active</option><option value="Out of Stock">Out of Stock</option></select>
                    <label>Voucher Codes</label><textarea id="edit-codes" rows="3"></textarea>
                </div>
                <div style="display: flex; gap: 10px; margin-top: 10px;">
                    <button class="btn" onclick="saveEdit()">Save Changes</button>
                    <button class="btn" onclick="closeEdit()" style="background: #4b5563;">Cancel</button>
                </div>
            </div>

            <div class="box">
                <h3 style="color: #f43f5e; margin-bottom: 10px;">📦 Manage Store Inventory</h3>
                <table>
                    <thead><tr><th>Category</th><th>Name</th><th>Stock</th><th>Status</th><th>Action</th></tr></thead>
                    <tbody id="inventory-table-body"></tbody>
                </table>
            </div>

            <button class="del-btn" style="width: 100%; padding: 10px;" onclick="logout()">Logout</button>
        </div>
    </div>

    <script src="ads.js"></script>
    <script>
        let appData = {};
        let editData = { active: false, type: '', catKey: '', itemIndex: -1, folderKey: '' };

        function login() {
            const email = document.getElementById('admin-email').value;
            const pass = document.getElementById('admin-pass').value;
            auth.signInWithEmailAndPassword(email, pass).then(() => {
                document.getElementById('login-box').style.display = 'none';
                document.getElementById('dashboard').style.display = 'block';
                listenLiveData();
            }).catch(() => alert("Login Failed."));
        }

        function logout() { auth.signOut().then(() => location.reload()); }

        function listenLiveData() {
            db.ref('storeData').on('value', (snapshot) => {
                appData = snapshot.val() || {};
                updateDropdowns();
                renderInventory();
            });

            db.ref('registeredUsers').on('value', (snapshot) => {
                const usersTable = document.getElementById('users-table-body');
                usersTable.innerHTML = '';
                if(snapshot.exists()) {
                    const usersData = snapshot.val();
                    const userKeys = Object.keys(usersData);
                    document.getElementById('total-users-count').innerText = userKeys.length;
                    userKeys.forEach(uid => {
                        const u = usersData[uid];
                        usersTable.innerHTML += `<tr><td>${u.name}</td><td>${u.email}</td><td>${u.lastLogin || '-'}</td></tr>`;
                    });
                } else {
                    document.getElementById('total-users-count').innerText = "0";
                    usersTable.innerHTML = `<tr><td colspan="3" style="text-align:center;">No users found.</td></tr>`;
                }
            });

            db.ref('orders').orderByChild('status').equalTo('Pending Verification').on('value', (snapshot) => {
                const ordersTable = document.getElementById('orders-table-body');
                ordersTable.innerHTML = '';
                if(snapshot.exists()) {
                    const orders = snapshot.val();
                    Object.keys(orders).forEach(orderId => {
                        const o = orders[orderId];
                        ordersTable.innerHTML += `
                            <tr>
                                <td>${o.email}<br><small style="color:#9ca3af">${o.timestamp}</small></td>
                                <td><strong>${o.itemName}</strong><br>${o.price}</td>
                                <td style="color:#eab308; font-family:monospace;">${o.utr}</td>
                                <td>
                                    <button class="app-btn" onclick="approveOrder('${orderId}', '${o.catKey}', ${o.itemIdx})">Approve</button>
                                    <button class="del-btn" onclick="rejectOrder('${orderId}')">Reject</button>
                                </td>
                            </tr>
                        `;
                    });
                } else {
                    ordersTable.innerHTML = `<tr><td colspan="4" style="text-align:center; color:#9ca3af;">No pending orders.</td></tr>`;
                }
            });
        }

        function approveOrder(orderId, catKey, itemIdx) {
            if(!confirm("Approve this payment?")) return;
            let itemRef = appData[catKey].items[itemIdx];
            if(!itemRef.codes || itemRef.codes.length === 0) {
                alert("Error: Out of stock!");
                return;
            }
            let codeToSend = itemRef.codes.shift();
            db.ref('storeData/' + catKey + '/items/' + itemIdx).set(itemRef).then(() => {
                db.ref('orders/' + orderId).update({ status: 'Approved', code: codeToSend });
                alert("Approved successfully!");
            });
        }

        function rejectOrder(orderId) {
            if(!confirm("Reject this order?")) return;
            db.ref('orders/' + orderId).update({ status: 'Rejected' });
        }

        function saveToDB() { db.ref('storeData').set(appData); }

        function addMainCategory() {
            const name = document.getElementById('new-main-name').value.trim();
            const desc = document.getElementById('new-main-desc').value.trim();
            if(!name) return alert("Name required!");
            const key = 'main_' + Date.now();
            appData[key] = { title: name, desc: desc, items: [], subFolders: [] };
            saveToDB();
            document.getElementById('new-main-name').value = '';
            document.getElementById('new-main-desc').value = '';
        }

        function updateDropdowns() {
            const mainSelect = document.getElementById('add-main-cat');
            mainSelect.innerHTML = '';
            for(let key in appData) {
                if(!appData[key].parentKey) {
                    mainSelect.innerHTML += `<option value="${key}">${appData[key].title}</option>`;
                }
            }
            updateSubCatDropdown();
        }

        function updateSubCatDropdown() {
            const mainCat = document.getElementById('add-main-cat').value;
            const subSelect = document.getElementById('add-sub-cat');
            subSelect.innerHTML = '<option value="">-- Direct Item --</option>';
            if(mainCat && appData[mainCat] && appData[mainCat].subFolders) {
                appData[mainCat].subFolders.forEach(folder => {
                    subSelect.innerHTML += `<option value="${folder.key}">📁 ${folder.name}</option>`;
                });
            }
        }

        function togglePriceField() {
            const type = document.getElementById('add-type').value;
            document.getElementById('price-box').style.display = type === 'folder' ? 'none' : 'block';
        }

        function addEntity() {
            const mainCat = document.getElementById('add-main-cat').value;
            const subCat = document.getElementById('add-sub-cat').value;
            const type = document.getElementById('add-type').value;
            const name = document.getElementById('add-name').value.trim();
            const desc = document.getElementById('add-desc').value.trim();
            const price = document.getElementById('add-price').value.trim();
            const status = document.getElementById('add-status').value;
            const rawCodes = document.getElementById('add-codes').value.trim();
            const codesArray = rawCodes ? rawCodes.split('\n').map(c => c.trim()).filter(c => c) : [];

            if(!mainCat || !name) return alert("Category and Name required!");

            if(type === 'folder') {
                if(subCat) return alert("Cannot create folder inside a folder.");
                const newKey = 'cat_' + Date.now();
                if(!appData[mainCat].subFolders) appData[mainCat].subFolders = [];
                appData[mainCat].subFolders.push({ key: newKey, name: name, desc: desc });
                appData[newKey] = { title: name, desc: desc, parentKey: mainCat, items: [], subFolders: [] };
            } else {
                const targetCat = subCat ? subCat : mainCat;
                if(!appData[targetCat].items) appData[targetCat].items = [];
                appData[targetCat].items.push({ id: Date.now(), name, desc, price, status, codes: codesArray });
            }
            document.getElementById('add-name').value = '';
            document.getElementById('add-desc').value = '';
            document.getElementById('add-price').value = '';
            document.getElementById('add-codes').value = '';
            saveToDB();
            alert("Added successfully!");
        }

        function renderInventory() {
            const tbody = document.getElementById('inventory-table-body');
            tbody.innerHTML = '';
            for(let key in appData) {
                const cat = appData[key];
                if(!cat) continue;
                if(!cat.parentKey) {
                    tbody.innerHTML += `<tr style="background: #1f2937;"><td><strong>[Main] ${cat.title}</strong></td><td>-</td><td>-</td><td>-</td><td><button class="edit-btn" onclick="openEdit('main_cat', '${key}', -1, '')">Edit</button><button class="del-btn" onclick="deleteMainCat('${key}')">Delete</button></td></tr>`;
                }
                if(cat.subFolders) {
                    cat.subFolders.forEach(folder => {
                        tbody.innerHTML += `<tr><td>${cat.title}</td><td>📁 ${folder.name}</td><td>-</td><td>-</td><td><button class="edit-btn" onclick="openEdit('folder', '${key}', -1, '${folder.key}')">Edit</button><button class="del-btn" onclick="deleteEntity('folder', '${key}', -1, '${folder.key}')">Delete</button></td></tr>`;
                    });
                }
                if(cat.items) {
                    cat.items.forEach((item, index) => {
                        let stock = item.codes ? item.codes.length : 0;
                        tbody.innerHTML += `<tr><td>${cat.title || key}</td><td>${item.name}</td><td>${stock}</td><td>${item.status}</td><td><button class="edit-btn" onclick="openEdit('item', '${key}', ${index}, '')">Edit</button><button class="del-btn" onclick="deleteEntity('item', '${key}', ${index}, '')">Delete</button></td></tr>`;
                    });
                }
            }
        }

        function openEdit(type, parentCat, itemIndex, folderKey) {
            editData = { active: true, type, catKey: parentCat, itemIndex, folderKey };
            document.getElementById('edit-box').style.display = 'block';
            if(type === 'main_cat' || type === 'folder') {
                document.getElementById('edit-price-box').style.display = 'none';
                let data = type === 'main_cat' ? appData[parentCat] : appData[parentCat].subFolders.find(f => f.key === folderKey);
                document.getElementById('edit-name').value = data.title || data.name;
                document.getElementById('edit-desc').value = data.desc || '';
            } else {
                document.getElementById('edit-price-box').style.display = 'block';
                let item = appData[parentCat].items[itemIndex];
                document.getElementById('edit-name').value = item.name;
                document.getElementById('edit-desc').value = item.desc;
                document.getElementById('edit-price').value = item.price;
                document.getElementById('edit-status').value = item.status;
                document.getElementById('edit-codes').value = item.codes ? item.codes.join('\n') : '';
            }
        }

        function closeEdit() { editData.active = false; document.getElementById('edit-box').style.display = 'none'; }

        function saveEdit() {
            if(!editData.active) return;
            const name = document.getElementById('edit-name').value.trim();
            const desc = document.getElementById('edit-desc').value.trim();
            if(editData.type === 'main_cat') {
                appData[editData.catKey].title = name;
                appData[editData.catKey].desc = desc;
            } else if(editData.type === 'folder') {
                let folder = appData[editData.catKey].subFolders.find(f => f.key === editData.folderKey);
                if(folder) folder.name = name; folder.desc = desc;
            } else {
                const price = document.getElementById('edit-price').value.trim();
                const status = document.getElementById('edit-status').value;
                const codes = document.getElementById('edit-codes').value.trim().split('\n').map(c => c.trim()).filter(c => c);
                appData[editData.catKey].items[editData.itemIndex] = { ...appData[editData.catKey].items[editData.itemIndex], name, desc, price, status, codes };
            }
            saveToDB(); closeEdit(); alert("Updated successfully!");
        }

        function deleteMainCat(key) {
            if(!confirm("Delete main category and all its contents?")) return;
            if(appData[key].subFolders) appData[key].subFolders.forEach(sub => delete appData[sub.key]);
            delete appData[key]; saveToDB();
        }

        function deleteEntity(type, parentCat, itemIndex, folderKey) {
            if(!confirm("Delete this?")) return;
            if(type === 'folder') {
                appData[parentCat].subFolders = appData[parentCat].subFolders.filter(f => f.key !== folderKey);
                delete appData[folderKey];
            } else {
                appData[parentCat].items.splice(itemIndex, 1);
            }
            saveToDB(); closeEdit();
        }
    </script>
</body>
</html>
