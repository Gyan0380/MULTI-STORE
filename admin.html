<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - Developer Gyan</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>

        const firebaseConfig = {
            apiKey: "AIzaSyDc8SBATauI9wMiwvIsrYsIuyXD_QOCKB8",
            authDomain: "developer-ab7cb.firebaseapp.com",
            databaseURL: "https://developer-ab7cb-default-rtdb.firebaseio.com",
            projectId: "developer-ab7cb",
            storageBucket: "developer-ab7cb.firebasestorage.app",
            messagingSenderId: "178491860220",
            appId: "1:178491860220:web:d874ac1cb68954c2d02379"
        };
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        const auth = firebase.auth();
    </script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { background-color: #05050a; color: #fff; padding: 20px; }
        .container { max-width: 900px; margin: 0 auto; }
        h2 { color: #f87171; text-align: center; margin-bottom: 20px; }
        .box { background: rgba(20, 20, 30, 0.9); border: 1px solid rgba(168, 85, 247, 0.3); padding: 25px; border-radius: 12px; margin-bottom: 20px; }
        input, select { width: 100%; padding: 10px; margin: 10px 0; background: #05050a; border: 1px solid rgba(168, 85, 247, 0.4); border-radius: 6px; color: #fff; outline: none;}
        .btn { background: linear-gradient(135deg, #9333ea, #38bdf8); color: white; border: none; padding: 10px 20px; border-radius: 6px; cursor: pointer; font-weight: bold; width: 100%; }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; font-size: 0.9rem; }
        th, td { border: 1px solid rgba(168, 85, 247, 0.2); padding: 10px; text-align: left; }
        th { background: rgba(168, 85, 247, 0.1); color: #c084fc; }
        .del-btn { background: #dc2626; color: #fff; border: none; padding: 5px 10px; border-radius: 4px; cursor: pointer; }
        .edit-btn { background: #f59e0b; color: #fff; border: none; padding: 5px 10px; border-radius: 4px; cursor: pointer; margin-right: 5px;}
    </style>
</head>
<body>

    <div class="container">
        <h2>🔒 Central Secured Admin Dashboard</h2>
        <div style="text-align: center; margin-bottom: 20px;">
            <a href="index.html" style="color: #38bdf8; text-decoration: none;">← Go to Main Website</a>
        </div>

        <div id="login-box" class="box">
            <h3>Secure Admin Authentication</h3>
            <p style="color:#94a3b8; font-size: 0.9rem; margin-bottom:10px;">Enter your Firebase Admin Email & Password</p>
            <input type="email" id="admin-email" placeholder="Admin Email (e.g. admin@developergyan.com)">
            <input type="password" id="admin-pass" placeholder="Enter Password...">
            <button class="btn" onclick="login()">Access Dashboard</button>
        </div>

        <div id="dashboard" style="display: none;">
            <div class="box" style="border-color: #e879f9;">
                <h3 style="color: #e879f9;">📢 Post New Advertisement</h3>
                <label style="color:#e879f9;">Display Location</label>
                <select id="ad-placement">
                    <option value="both">Both (Home & Offers Page)</option>
                    <option value="home">Only Home Page</option>
                    <option value="offers">Only Offers Page</option>
                </select>
                <input type="text" id="ad-title" placeholder="Ad Title (e.g. Mega Sale)">
                <input type="text" id="ad-image" placeholder="Image URL (Discord link recommended)">
                <input type="number" id="ad-minutes" placeholder="Auto-Close Timer (Minutes)">
                <input type="text" id="ad-link" placeholder="Redirect URL (Discord User ID Link)">
                <button class="btn" onclick="addNewAd()" style="background: linear-gradient(135deg, #e879f9, #a855f7);">Post Live Ad</button>
                <h4 style="margin-top: 20px; color: #e879f9;">Active Ads</h4>
                <div style="overflow-x: auto;">
                    <table><thead><tr><th>Title</th><th>Location</th><th>Action</th></tr></thead><tbody id="ads-table-body"></tbody></table>
                </div>
            </div>

            <div class="box" id="add-item-box">
                <h3 style="color: #38bdf8;" id="form-heading">🏪 Add New Store Item</h3>
                <label style="color:#38bdf8;">Select Category (Folder or Main)</label>
                <select id="item-cat">
                    <option value="steam">Steam Account</option>
                    <option value="gaming_acc">Gaming Account</option>
                    <option value="prebuild_server">Prebuild DC Server</option>
                    <option value="custom_server">Custom Server Builder</option>
                    <option value="custom_bot">Custom Bot Builder</option>
                    <option value="vouchers">Vouchers</option>
                    <option value="bgmi_uc">BGMI UC Vouchers (Inside Gaming Vouchers)</option>
                </select>
                <input type="text" id="item-name" placeholder="Item Name (e.g. Conqueror Account)">
                <input type="text" id="item-desc" placeholder="Description details...">
                <input type="text" id="item-price" placeholder="Price (e.g. ₹799)">
                <select id="item-status">
                    <option value="Active">Active</option>
                    <option value="New Stock Available">New Stock Available</option>
                    <option value="Out of Stock">Out of Stock</option>
                    <option value="Coming Soon">Coming Soon</option>
                </select>
                <button class="btn" id="save-item-btn" onclick="saveItem()">Add Live Store Item</button>
                <button class="btn" id="cancel-edit-btn" onclick="cancelEdit()" style="display:none; background: #4b5563; margin-top:10px;">Cancel Edit</button>

                <h4 style="margin-top: 20px; color: #38bdf8;">Store Inventory</h4>
                <div style="overflow-x: auto;">
                    <table>
                        <thead><tr><th>Category</th><th>Item</th><th>Status</th><th>Actions</th></tr></thead>
                        <tbody id="items-table-body"></tbody>
                    </table>
                </div>
            </div>

            <button class="del-btn" style="width: 100%; padding: 12px; font-size: 1.1rem; font-weight: bold;" onclick="logout()">Logout / Lock Dashboard</button>
        </div>
    </div>

    <script src="ads.js"></script>
    
    <script>
        let appData = {};
        let editMode = false;
        let editCategory = '';
        let editIndex = -1;

        function login() {
            const email = document.getElementById('admin-email').value;
            const pass = document.getElementById('admin-pass').value;
            if(!email || !pass) return alert("Please enter Email and Password!");

            auth.signInWithEmailAndPassword(email, pass)
                .then(() => {
                    document.getElementById('login-box').style.display = 'none';
                    document.getElementById('dashboard').style.display = 'block';
                    listenLiveData(); 
                })
                .catch((error) => alert("Authentication Failed: Wrong Email or Password."));
        }

        function logout() { auth.signOut().then(() => location.reload()); }

        function listenLiveData() {
            db.ref('storeData').on('value', (snapshot) => {
                if (snapshot.exists()) {
                    appData = snapshot.val();
                    renderStoreTable();
                }
            });
        }

        function saveStoreToDB() { db.ref('storeData').set(appData); }

        function renderAdsTable() {
            const tbody = document.getElementById('ads-table-body');
            tbody.innerHTML = '';
            getActiveAds().forEach(ad => {
                const loc = ad.placement === 'both' ? 'Both' : ad.placement === 'home' ? 'Home' : 'Offers';
                tbody.innerHTML += `<tr><td><strong>${ad.title}</strong></td><td>${loc}</td><td><button class="del-btn" onclick="deleteAd(${ad.id})">Delete</button></td></tr>`;
            });
        }

        function renderStoreTable() {
            const tbody = document.getElementById('items-table-body');
            tbody.innerHTML = '';
            for(let cat in appData) {
                if(appData[cat].items) {
                    appData[cat].items.forEach((item, index) => {
                        let statusColor = item.status === 'Active' ? '#34d399' : item.status === 'Out of Stock' ? '#f87171' : '#fbbf24';
                        tbody.innerHTML += `
                            <tr>
                                <td>${appData[cat].title || cat}</td>
                                <td><strong>${item.name}</strong><br><small style="color:#94a3b8">${item.price}</small></td>
                                <td style="color:${statusColor}; font-weight:bold;">${item.status}</td>
                                <td style="white-space: nowrap;">
                                    <button class="edit-btn" onclick="startEdit('${cat}', ${index})">✏️ Edit</button>
                                    <button class="del-btn" onclick="deleteItem('${cat}', ${index})">🗑️</button>
                                </td>
                            </tr>
                        `;
                    });
                }
            }
        }

        // NEW EDIT SYSTEM LOGIC
        function startEdit(cat, idx) {
            editMode = true;
            editCategory = cat;
            editIndex = idx;
            const item = appData[cat].items[idx];

            document.getElementById('form-heading').innerText = "✏️ Edit Store Item";
            document.getElementById('form-heading').style.color = "#f59e0b";
            
            document.getElementById('item-cat').value = cat;
            document.getElementById('item-name').value = item.name;
            document.getElementById('item-desc').value = item.desc;
            document.getElementById('item-price').value = item.price;
            document.getElementById('item-status').value = item.status;
            
            document.getElementById('save-item-btn').innerText = "Update Changes";
            document.getElementById('save-item-btn').style.background = "linear-gradient(135deg, #f59e0b, #ea580c)";
            document.getElementById('cancel-edit-btn').style.display = "block";
            
            window.scrollTo(0, document.getElementById('add-item-box').offsetTop - 50);
        }

        function cancelEdit() {
            editMode = false;
            editCategory = '';
            editIndex = -1;
            
            document.getElementById('form-heading').innerText = "🏪 Add New Store Item";
            document.getElementById('form-heading').style.color = "#38bdf8";
            
            document.getElementById('item-name').value = '';
            document.getElementById('item-desc').value = '';
            document.getElementById('item-price').value = '';
            
            document.getElementById('save-item-btn').innerText = "Add Live Store Item";
            document.getElementById('save-item-btn').style.background = "linear-gradient(135deg, #9333ea, #38bdf8)";
            document.getElementById('cancel-edit-btn').style.display = "none";
        }

        function saveItem() {
            const cat = document.getElementById('item-cat').value;
            const name = document.getElementById('item-name').value;
            const desc = document.getElementById('item-desc').value;
            const price = document.getElementById('item-price').value;
            const status = document.getElementById('item-status').value;

            if(!name || !price) return alert("Fill Name & Price!");
            
            if(editMode) {
                // UPDATE EXISTING
                appData[editCategory].items[editIndex] = { id: appData[editCategory].items[editIndex].id, name, desc, price, status };
                alert("Item Updated Successfully!");
                cancelEdit(); // Reset form
            } else {
                // ADD NEW
                if(!appData[cat].items) appData[cat].items = [];
                appData[cat].items.push({ id: Date.now(), name, desc, price, status });
                alert("Live Item Added to Store!");
                document.getElementById('item-name').value = '';
                document.getElementById('item-desc').value = '';
                document.getElementById('item-price').value = '';
            }
            saveStoreToDB();
        }

        function deleteItem(cat, idx) {
            if(confirm("Delete this Live Item?")) {
                appData[cat].items.splice(idx, 1);
                saveStoreToDB();
                if(editMode && editCategory === cat && editIndex === idx) cancelEdit();
            }
        }
    </script>
</body>
</html>
