        </div>

        <!-- 3. DYNAMIC CATEGORY / FOLDER VIEW -->
        <div id="category-view" class="view">
            <div class="sub-header">
                <a href="#" class="back-link" id="back-button" onclick="switchView('store-view')">← Back to Store</a>
                <h2 class="section-title" id="cat-title" style="text-align: left;">Category Offers</h2>
                <p style="color: #94a3b8;" id="cat-desc">Browse available items and check pricing below.</p>
            </div>

            <!-- Sub-folder container -->
            <div class="grid-container" id="sub-folder-container" style="margin-bottom: 25px; display: none;"></div>

            <!-- Items container -->
            <div class="item-list" id="dynamic-item-list"></div>

            <!-- Notice Box -->
            <div class="notice-box">
                <p><strong>Terms & Conditions:</strong> Need 100% advance first.</p>
                <p><strong>Payment Method:</strong> Only UPI payment available right now.</p>
            </div>
        </div>

    </div>

    <div class="footer">© 2026 Developer Gyan. All Rights Reserved.</div>

    <script>
        const defaultMainData = {
            steam: { title: "Steam Accounts", desc: "Find best accounts pre-loaded with top games at cheap prices.", items: [{ id: 1, name: "Random Steam Level 20+ Account", desc: "Contains random premium games + full access.", price: "₹149", status: "Active" }, { id: 2, name: "GTA V Premium Steam Account", desc: "Email change available with instant delivery.", price: "₹299", status: "Active" }] },
            gaming_acc: { title: "Gaming Accounts", desc: "Pro accounts for BGMI, Free Fire, Valorant, etc.", items: [{ id: 3, name: "BGMI Conqueror Tier Account", desc: "Max RP, rare outfits, safe login.", price: "₹799", status: "Active" }, { id: 4, name: "Free Fire Max Old Elite Pass ID", desc: "Level 70+, rare bundles.", price: "₹499", status: "Active" }] },
            vouchers: { title: "Food & Shopping Vouchers", desc: "Get discount vouchers for Zomato, Dominos, EGC, and clothing apps.", items: [{ id: 7, name: "Zomato / Dominos Food Voucher", desc: "Flat discount voucher code for food delivery apps.", price: "₹49", status: "Active" }, { id: 8, name: "Clothing Brand Gift Card (EGC)", desc: "Redeemable voucher for fashion apps.", price: "₹199", status: "Active" }] },
            gaming_vouchers: { title: "Gaming Vouchers", desc: "Select a gaming voucher sub-category below.", subFolders: [{ key: "bgmi_uc", name: "BGMI UC Vouchers", desc: "Best selling BGMI UC top-up packs at cheapest prices." }], items: [] },
            bgmi_uc: { title: "BGMI UC Vouchers", desc: "Best selling BGMI UC packs at cheapest prices with instant secure delivery.", parentKey: "gaming_vouchers", items: [{ id: 17, name: "360 UC", desc: "Selling in (Pice): ₹380", price: "₹419", status: "Active" }, { id: 18, name: "720 UC", desc: "Selling in (Pice): ₹750", price: "₹819", status: "Active" }, { id: 19, name: "1950 UC", desc: "Selling in (Pice): ₹1,900", price: "₹2,099", status: "Active" }, { id: 20, name: "4050 UC", desc: "Selling in (Pice): ₹3,800", price: "₹4,199", status: "Active" }, { id: 21, name: "8400 UC", desc: "Selling in (Pice): ₹7,500", price: "₹8,299", status: "Active" }] }
        };

        let storeData = JSON.parse(localStorage.getItem('devGyanMainData'));
        if(!storeData) { storeData = defaultMainData; localStorage.setItem('devGyanMainData', JSON.stringify(storeData)); }

        function toggleSidebar() { document.getElementById('sidebar').classList.toggle('active'); }
        
        function switchView(viewId) { 
            document.querySelectorAll('.view').forEach(v => v.classList.remove('active')); 
            document.getElementById(viewId).classList.add('active'); 
            window.scrollTo(0, 0); 
        }

        function loadCategoryData(catKey) {
            const cat = storeData[catKey];
            document.getElementById('cat-title').innerText = cat.title;
            document.getElementById('cat-desc').innerText = cat.desc;

            const backBtn = document.getElementById('back-button');
            if(cat.parentKey) { backBtn.setAttribute('onclick', `loadCategoryData('${cat.parentKey}')`); backBtn.innerText = "← Back to " + storeData[cat.parentKey].title; } 
            else { backBtn.setAttribute('onclick', "switchView('store-view')"); backBtn.innerText = "← Back to Store"; }

            const subContainer = document.getElementById('sub-folder-container');
            subContainer.innerHTML = '';
            if(cat.subFolders && cat.subFolders.length > 0) {
                subContainer.style.display = 'grid';
                cat.subFolders.forEach(folder => {
                    subContainer.innerHTML += `<div class="card"><div><h3>📁 ${folder.name}</h3><p>${folder.desc}</p></div><button class="card-btn" onclick="loadCategoryData('${folder.key}')">See Offers</button></div>`;
                });
            } else { subContainer.style.display = 'none'; }

            const listContainer = document.getElementById('dynamic-item-list');
            listContainer.innerHTML = '';
            if(cat.items && cat.items.length > 0) {
                cat.items.forEach(item => {
                    let badgeClass = item.status === 'Active' ? 'active' : item.status === 'New Stock Available' ? 'stock' : item.status === 'Coming Soon' ? 'soon' : item.status === 'Expired' ? 'expired' : 'nostock';
                    listContainer.innerHTML += `<div class="item-row"><div class="item-details"><h4>${item.name}</h4><span>${item.desc}</span><br><span class="badge ${badgeClass}" style="margin-top:8px; display:inline-block;">${item.status}</span></div><div><div class="price-tag">${item.price}</div><a href="https://discord.gg/qHfvn2ntqx" target="_blank" class="btn" style="padding:6px 15px; font-size:0.85rem; margin-top:8px;">Join Store DC Server</a></div></div>`;
                });
            }
            switchView('category-view');
        }

        window.onload = function() { switchView('welcome-view'); }
    </script>
</body>
</html>
